<!DOCTYPE html>
<html lang="ko">
<meta charset="utf-8">
<title>포항 과원 작업판단</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css?v=202609161130">
<link rel="stylesheet" href="style.css?v=202609161130">

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">포항 과원 작업판단</div>
        <div class="brand-sub">필지 단위 농작업 의사결정 · 실제 데이터만 표시</div>
      </div>
    </div>
    <form class="search" id="search-form" role="search" autocomplete="off">
      <label for="search-input" class="sr-only">주소·지번·장소 검색</label>
      <input id="search-input" type="search" placeholder="주소·지번·장소 검색 (예: 포항 죽장면 두마리 1294)">
      <button type="submit" id="search-btn">검색</button>
      <ul class="search-results" id="search-results" hidden></ul>
    </form>
  </header>

  <aside class="fields" aria-label="내 필지">
    <div class="pane-head">
      <h2>내 필지</h2>
      <span class="count" id="field-count"></span>
    </div>
    <ul class="field-list" id="field-list"></ul>
  </aside>

  <main class="map-wrap">
    <div id="map" aria-label="필지 지도"></div>
    <div class="map-note" id="map-note" hidden></div>
  </main>

  <section class="detail" aria-label="선택 필지" id="detail"></section>
</div>

<!-- 지도: 기본은 Leaflet + VWorld(위성·일반·지적도). 지도 도구의 "네이버" 버튼으로 같은 위치를 네이버 지도로 바꿔 볼 수 있다
     (스크립트는 누를 때 불러온다). ?map=naver로 열면 네이버 지도로 시작 -->
<script>
  window.MAP_PARAM = new URLSearchParams(location.search).get("map");
  // 루트 블로그의 서비스워커가 이 데모를 캐시해 옛 화면을 내보내는 걸 막는다 (sw.js 주석 참고)
  navigator.serviceWorker?.register("sw.js").catch(() => {});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js?v=202609161130"></script>
<script src="robot/haanmi57.js?v=202609161130"></script>
<script src="vworld.js?v=202609161130"></script>
<script src="regions.js?v=202609161130"></script>
<script src="publicdata.js?v=202609161130"></script>
<script src="mapview.js?v=202609161130"></script>
<script src="robot.js?v=202609161130"></script>
<script src="app.js?v=202609161130"></script>
<script src="search.js?v=202609161130"></script>
