<!DOCTYPE html>
<html lang="ko">
<meta charset="utf-8">
<title>포항 과원 작업판단</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">포항 과원 작업판단</div>
        <div class="brand-sub">필지 단위 농작업 의사결정 · 데모</div>
      </div>
    </div>
    <form class="search" id="search-form" role="search" autocomplete="off">
      <label for="search-input" class="sr-only">주소·지번·농장명 검색</label>
      <input id="search-input" type="search" placeholder="주소·지번·농장명 검색 (예: 포항 죽장면 두마리)">
      <button type="submit" id="search-btn">검색</button>
      <ul class="search-results" id="search-results" hidden></ul>
    </form>
    <div class="topbar-meta">
      <span class="chip chip-mock" title="모든 수치는 화면 확인용 예시 데이터입니다">목업 데이터</span>
      <span class="chip" id="alert-chip"></span>
      <label class="time-select" for="hour-select">
        <span>기준 시각</span>
        <select id="hour-select"></select>
      </label>
    </div>
  </header>

  <aside class="fields" aria-label="농지 목록">
    <div class="pane-head">
      <h2>내 농지</h2>
      <span class="count" id="field-count"></span>
    </div>
    <div class="index-switch" role="radiogroup" aria-label="지도 색상 기준" id="index-switch"></div>
    <ul class="field-list" id="field-list"></ul>
    <div class="legend" id="status-legend"></div>
  </aside>

  <main class="map-wrap">
    <div id="map" aria-label="필지 지도"></div>
    <div class="map-note" id="map-note" hidden>배경지도 자리 · 실서비스는 VWorld 위성/일반지도</div>
  </main>

  <section class="detail" aria-label="선택 필지" id="detail"></section>

  <section class="bottom" aria-label="상세 정보">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tab-body" id="tab-body"></div>
  </section>
</div>

<!-- 네이버 지도는 ?map=naver 일 때만 로드. Client ID는 도메인 제한 공개키 — 콘솔 Web 서비스 URL에 등록된 주소에서만 동작 -->
<script>
  if (new URLSearchParams(location.search).get("map") === "naver") {
    document.write('<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=v33u514rqa&submodules=geocoder"><\/script>');
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="mapview.js"></script>
<script src="app.js"></script>
<script src="search.js"></script>
